name: Pages

on:
  push:
    branches: ["main"]

jobs:
  pages:
    name: Pages
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Prepare Pages Root
        run: |
          install -Dm 644 bin/install.sh _site/install.sh
          echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPFQ+VK4y/tYvIGxEwalz6CPuDckHooWvJT8+ZmXvUv8" > _site/ssh.pub

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5.0.0

      - name: Deploy Pages
        uses: actions/deploy-pages@v5.0.1

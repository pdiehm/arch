name: Pages

on:
  push:
    branches: ["main"]

jobs:
  pages:
    name: Pages
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Prepare Pages Root
        run: |
          install -Dm 644 bin/install.sh _site/install.sh
          sed -En 's/\s*echo "(ssh-.*)" .*/\1/p' res/bin/mk.sh > _site/ssh.pub

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5.0.0

      - name: Deploy Pages
        uses: actions/deploy-pages@v5.0.1

foreground #DDDDDD
background #000000
background_opacity 0.5

selection_foreground #111111
selection_background #39CCCC

cursor #DDDDDD
cursor_text_color #111111

color0 #111111
color1 #FF4136
color2 #2ECC40
color3 #FFDC00
color4 #0074D9
color5 #F012BE
color6 #7FDBFF
color7 #FFFFFF

detect_urls no
close_on_child_death yes
scrollback_pager_history_size 64

clear_all_mouse_actions yes
mouse_map left press ungrabbed mouse_selection normal
mouse_map left doublepress ungrabbed mouse_selection word
mouse_map left triplepress ungrabbed mouse_selection line
mouse_map right press ungrabbed mouse_selection extend

clear_all_shortcuts yes
map ctrl+shift+c copy_selection_or_last_command_output
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+h show_scrollback
map ctrl+shift+g show_last_command_output
map ctrl+shift+u kitten unicode_input
map ctrl+shift+equal change_font_size all +1
map ctrl+shift+minus change_font_size all -1
map ctrl+shift+backspace change_font_size all 0

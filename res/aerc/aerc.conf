[general]
default-save-path = ~/Downloads
pgp-provider = gpg
use-terminal-pinentry = true
unsafe-accounts-conf = true

[ui]
index-columns = "flags:8,name<20%,subject,date>="
column-flags = '{{.Flags | join ""}}'
column-name = "{{index (.From | names) 0}}"
column-subject = "{{.ThreadPrefix}}{{.SubjectBase}}"
column-date = "{{.DateAutoFormat .Date.Local}}"

timestamp-format = "02 Jan 2006"
this-day-time-format = "15:04"
this-week-time-format = "Jan 02, 15:04"
this-year-time-format = "Jan 02, 15:04"
message-view-timestamp-format = "Mon, 02 Jan 2006 15:04:05 -0700"

spinner = ",,,,,"
spinner-interval = 80ms

icon-encrypted = " "
icon-signed = " "
icon-unknown = " "
icon-invalid = " "
icon-attachment = " "
icon-new = " "
icon-old = " "
icon-replied = " "
icon-forwarded = " "
icon-flagged = " "
icon-marked = ""
icon-draft = " "
icon-deleted = " "

threading-enabled = true
show-thread-context = true
thread-prefix-tip = ""
thread-prefix-indent = " "
thread-prefix-stem = "│"
thread-prefix-limb = "─"
thread-prefix-first-child = "─"
thread-prefix-has-siblings = "├"
thread-prefix-last-sibling = "└"

[statusline]
status-columns = "left<*,center>=,right>*"
column-left = "[{{.Account}}] {{.StatusInfo}}"
column-center = "{{.TrayInfo}}"
column-right = "{{.PendingKeys}}  {{cwd}}"

[compose]
editor=nvim
address-book-cmd = carddav-query %s
reply-to-self = false

[filters]
.headers = colorize
message/rfc822 = colorize
message/delivery-status = colorize
text/plain = colorize
text/html = html
text/x-patch = delta
text/calendar = calendar
text/* = bat --plain --force-colorization --file-name "$AERC_FILENAME"
application/pdf = pdftotext -q -nopgbrk - -

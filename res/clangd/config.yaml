Diagnostics:
  MissingIncludes: Strict

  ClangTidy:
    Add:
      - "bugprone-*"
      - "cert-*"
      - "clang-analyzer-*"
      - "concurrency-*"
      - "cppcoreguidelines-*"
      - "misc-*"
      - "modernize-*"
      - "mpi-*"
      - "performance-*"
      - "portability-*"
      - "readability-*"

    Remove:
      - "*-magic-numbers"
      - "bugprone-easily-swappable-parameters"
      - "misc-no-recursion"
      - "modernize-use-trailing-return-type"
      - "readability-braces-around-statements"
      - "readability-function-cognitive-complexity"
      - "readability-identifier-length"

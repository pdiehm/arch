general {
  lock_cmd = if ! pidof hyprlock; then hyprlock & sleep 1 && hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'; fi
  unlock_cmd = pkill -USR1 hyprlock; hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
  before_sleep_cmd = pidof hyprlock || hyprlock
}

listener {
  timeout = 3600
  on-timeout = systemctl suspend
}
